<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Three bars with rounded corners -->
  <!-- Left bar (medium height) -->
  <rect x="15" y="40" width="20" height="50" rx="5" ry="5" fill="url(#blueGradient)" />
  <!-- Center bar (tallest) -->
  <rect x="40" y="20" width="20" height="70" rx="5" ry="5" fill="url(#blueGradient)" />
  <!-- Right bar (shortest) -->
  <rect x="65" y="55" width="20" height="35" rx="5" ry="5" fill="url(#blueGradient)" />
</svg>
